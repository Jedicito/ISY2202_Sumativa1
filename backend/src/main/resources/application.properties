spring.application.name=gamer-eventos-backend
server.port=8081

# --- Base de datos (MySQL local) ---
# La contraseña no va en el código: se toma del archivo externo
# config/application.properties (carpeta backend) o de la variable de entorno DB_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/gamer_eventos
spring.datasource.username=${DB_USER:gamer_app}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea el script db/gamer_eventos.sql; Hibernate solo las valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# La clave de firma se genera aleatoriamente al arrancar (ver JwtService).
jwt.expiration-minutes=60

# --- Actuator ---
# Solo se expone "health", restringido al rol ADMIN (ver SecurityConfig),
# y sus detalles solo se muestran a ese rol.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
