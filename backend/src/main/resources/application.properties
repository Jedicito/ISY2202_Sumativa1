spring.application.name=gamer-eventos-backend
server.port=8081

# --- Base de datos (MySQL local) ---
# Usuario y contraseña se leen desde variables de entorno, no van en el código.
spring.datasource.url=jdbc:mysql://localhost:3306/gamer_eventos
spring.datasource.username=${DB_USER:gamer_app}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crea el script db/gamer_eventos.sql; Hibernate solo las valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# Clave secreta de al menos 32 caracteres, leída desde variable de entorno.
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

# --- Actuator ---
# Se habilitan todos los endpoints de monitoreo para revisar la aplicación
# durante el desarrollo (configuración, rutas, salud, etc.).
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS
management.endpoint.configprops.show-values=ALWAYS
management.endpoint.health.show-details=always
